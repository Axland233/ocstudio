[package]
name = "ocstudio"
version = "0.1.0"
description = "OC Studio - 设定集共创桌面/移动应用"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ocstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# PC 端"选择工程目录"对话框(引导界面用)
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# LLM HTTP 客户端:纯 Rust TLS(Android 交叉编译必需,不能 native-tls)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
# SSE 流式读取
futures-util = "0.3"
# git 引擎(gitoxide):本地操作走默认 features;
# push/pull 到 GitHub 需要 blocking-network-client + reqwest-rustls transport
gix = { version = "0.87", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
similar = "3.2.0"
